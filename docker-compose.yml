services:
  mongodb:
    image: mongo:latest
    container_name: minifanroc_mongodb
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: miniFanRoC
      MONGO_INITDB_ROOT_USERNAME: user
      MONGO_INITDB_ROOT_PASSWORD: password
    restart: always

volumes:
  mongodb_data:
